name: Update paper account

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: write
  id-token: write

concurrency:
  group: paper-trader
  cancel-in-progress: false

jobs:
  update:
    if: ${{ github.repository == 'akc302/paperTradeCodex' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Trade, record timer evidence, and save (replays on newest main if another job pushed first)
        env:
          PAPER_STATE_KEY: ${{ secrets.PAPER_STATE_KEY }}
          PAPER_JOB_MODE: trade
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          scripts/commit-retry.sh 'Update paper account and market research' 'node scripts/trade-cycle.mjs && node scripts/timer-evidence.mjs' \
            data/market.json data/paper.json data/reviews.json data/operations.json data/learning.json data/portfolio.enc.json data/private-status.json data/codex-trading.json
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for uploaded Pages artifact to be visible
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: node scripts/wait-pages-artifact.mjs
      - name: Deploy updated dashboard
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
